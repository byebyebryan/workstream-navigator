[package]
name = "wsnav"
version = "0.1.0"
edition = "2024"
description = "A native-workflow terminal navigator for persistent coding workstreams across hosts."
repository = "https://github.com/byebyebryan/workstream-navigator"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.21", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23"

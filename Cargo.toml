[package]
name = "wsnav"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native-workflow terminal navigator for persistent host-local coding workstreams."
repository = "https://github.com/byebyebryan/workstream-navigator"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
uuid = { version = "1.21", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "hostname", "process", "signal", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "event", "process"] }

[dev-dependencies]
tempfile = "3.23"
